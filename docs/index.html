<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="2; url=https://github.com/callenflynn/kalamari-notes" />
    <title>Kalamari Notes</title>
    <style>
      :root {
        --accent: #ed5001;
        --bg: #1e1e1e;
        --text: #fffdf7;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffefe0;
          --text: #242424;
        }
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.5rem;
        color: var(--accent);
      }
      p {
        margin: 0;
        opacity: 0.8;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>Kalamari Notes</h1>
    <p>Redirecting to the <a href="https://github.com/callenflynn/kalamari-notes">repository</a>...</p>
  </body>
</html>
