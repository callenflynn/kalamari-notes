name: Build Tauri

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: tauri
        run: npm ci

      - name: Build Tauri
        working-directory: tauri
        run: npm run tauri build

      - name: Upload installer artifacts
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: kalamari-${{ matrix.platform }}
          path: |
            tauri/src-tauri/target/release/bundle/*.deb
            tauri/src-tauri/target/release/bundle/*.rpm
            tauri/src-tauri/target/release/bundle/*.AppImage
            tauri/src-tauri/target/release/bundle/*.dmg
            tauri/src-tauri/target/release/bundle/*.exe
            tauri/src-tauri/target/release/bundle/*.msi
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [build]
    # No if condition — always runs after build succeeds
    # Step-level conditions handle when to actually create a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        run: |
          APP_VERSION=$(grep '^version' tauri/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        id: create_tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            let tagExists = false;
            try {
              await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}` });
              tagExists = true;
              console.log(`Tag ${tag} already exists`);
            } catch (e) {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: '${{ github.sha }}'
              });
              console.log(`Created tag ${tag}`);
            }
            core.setOutput('tag_exists', tagExists);

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kalamari-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        # Only run on push to main or workflow_dispatch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.app_version }}
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: false
          files: artifacts/*
